[project]
name = "yh-portfolio"
version = "0.1.0"
description = "Personal portfolio and blog built with Zensical"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml>=6",
    "tzdata>=2026.5",
    "zensical==0.0.71",
]

[dependency-groups]
dev = [
    "pymarkdownlnt>=0.9.41",
    "pytest>=8",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]

[tool.ruff]
target-version = "py312"

# Pinned so a ruff upgrade cannot change what `make check` enforces: pyflakes (unused
# imports and names), pycodestyle errors, and import sorting.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["source_check", "project_cards"]
