[project]
name = "yh-portfolio"
version = "0.1.0"
description = "Personal portfolio and blog built with Zensical"
requires-python = ">=3.12,<3.13"
dependencies = [
    "tzdata>=2026.5",
    "zensical==0.0.71",
]

[dependency-groups]
dev = [
    "pymarkdownlnt>=0.9.41",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
