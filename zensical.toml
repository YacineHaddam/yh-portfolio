[project]
site_name = "Yacine Haddam"
site_description = "Portfolio and blog"
# TODO(author): replace the placeholder with the real GitHub Pages address (ticket 02).
# Social cards and Open Graph image URLs are built from this.
site_url = "https://YacineHaddam.github.io/yh-portfolio/"
docs_dir = "content"
site_dir = "site"
nav = [
    { "Home" = "index.md" },
    { "Projects" = "projects/index.md" },
    { "Blog" = "blog/index.md" },
    { "Tags" = "tags.md" },
    { "About" = "about.md" },
]
# MathJax renders the maths marked up by pymdownx.arithmatex (content/javascripts/mathjax.js).
extra_javascript = [
    "javascripts/mathjax.js",
    "https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js",
]

[project.markdown_extensions]
attr_list = {}
md_in_html = {}
admonition = {}
tables = {}
pymdownx.details = {}
pymdownx.superfences = {}
pymdownx.inlinehilite = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.arithmatex.generic = true

[project.plugins.blog]
post_excerpt = "required"
pagination = true
archive = true
post_readtime = true
# Allowed post categories. Using any other category fails the build.
categories_allowed = ["engineering", "machine-learning", "career", "notes"]

[project.plugins.tags]

[project.plugins.rss]
match_path = "blog/posts/.*"

# Generated preview cards and Open Graph / Twitter metadata for shared links.
[project.plugins.social]

# Jinja runs only on the Projects pages: the index card grid and each project's links (see docs/adr/0001).
[project.plugins.macros]
render_by_default = false
force_render_paths = "projects/*.md"
on_error_fail = true

[project.theme]
variant = "modern"
features = ["content.code.copy"]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# Contact links, shown in the footer of every page.
# TODO(author): replace the placeholder handles and address with your own.
[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/your-github-handle"
name = "GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://www.linkedin.com/in/your-linkedin-handle"
name = "LinkedIn"

[[project.extra.social]]
icon = "fontawesome/solid/paper-plane"
link = "mailto:you@example.com"
name = "Email"
