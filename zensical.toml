[project]
site_name = "Yacine Haddam"
site_description = "Portfolio and blog"
docs_dir = "content"
site_dir = "site"
nav = [
    { "Home" = "index.md" },
    { "Projects" = "projects/index.md" },
    { "Blog" = "blog/index.md" },
    { "Tags" = "tags.md" },
    { "About" = "about.md" },
]

[project.plugins.blog]
post_excerpt = "required"
pagination = true
archive = true
post_readtime = true
# Allowed post categories. Using any other category fails the build.
categories_allowed = ["engineering", "machine-learning", "career", "notes"]

[project.plugins.tags]

[project.plugins.rss]
match_path = "blog/posts/.*"

[project.theme]
variant = "modern"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"
