[project]
site_name = "Fixture site"
docs_dir = "content"
site_dir = "site"
nav = [
    { "Home" = "index.md" },
    { "Projects" = "projects/index.md" },
    { "Blog" = "blog/index.md" },
    { "Tags" = "tags.md" },
    { "About" = "about.md" },
]

[project.theme]
variant = "modern"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/fixture-user"
name = "GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://www.linkedin.com/in/fixture-user"
name = "LinkedIn"

[[project.extra.social]]
icon = "fontawesome/solid/paper-plane"
link = "mailto:fixture@example.com"
name = "Email"

[project.markdown_extensions]
attr_list = {}
md_in_html = {}

[project.plugins.blog]
post_excerpt = "required"
pagination = true
pagination_per_page = 1
archive = true
post_readtime = true
categories_allowed = ["engineering", "machine-learning", "career", "notes"]

[project.plugins.tags]

[project.plugins.rss]
match_path = "blog/posts/.*"

# Jinja runs only on the Projects pages: the index card grid and each project's links.
[project.plugins.macros]
render_by_default = false
force_render_paths = "projects/*.md"
on_error_fail = true
