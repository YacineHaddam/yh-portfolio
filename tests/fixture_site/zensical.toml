[project]
site_name = "Fixture site"
site_description = "Fixture site description"
site_url = "https://fixture.example.com/portfolio/"
docs_dir = "content"
site_dir = "site"
nav = [
    { "Home" = "index.md" },
    { "Projects" = "projects/index.md" },
    { "Blog" = "blog/index.md" },
    { "Tags" = "tags.md" },
    { "Authoring" = "authoring.md" },
    { "About" = "about.md" },
]
extra_javascript = [
    "javascripts/mathjax.js",
    "https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js",
]

[project.theme]
variant = "modern"
features = ["content.code.copy"]

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/fixture-user"
name = "GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://www.linkedin.com/in/fixture-user"
name = "LinkedIn"

[[project.extra.social]]
icon = "fontawesome/solid/paper-plane"
link = "mailto:fixture@example.com"
name = "Email"

[project.markdown_extensions]
attr_list = {}
md_in_html = {}
admonition = {}
tables = {}
pymdownx.details = {}
pymdownx.superfences = {}
pymdownx.inlinehilite = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.arithmatex.generic = true

[project.plugins.blog]
post_excerpt = "required"
pagination = true
pagination_per_page = 1
archive = true
post_readtime = true
categories_allowed = ["engineering", "machine-learning", "career", "notes"]

[project.plugins.tags]

[project.plugins.rss]
match_path = "blog/posts/.*"

[project.plugins.social]

# Jinja runs only on the Projects pages: the index card grid and each project's links.
[project.plugins.macros]
render_by_default = false
force_render_paths = "projects/*.md"
on_error_fail = true
